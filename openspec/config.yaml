schema: spec-driven

context: |
  Todo el material escrito de este proyecto va en castellano (ver la sección
  Idioma de AGENTS.md). En los artefactos de OpenSpec, mantener en inglés
  únicamente los encabezados estructurales y las palabras clave SHALL/MUST.

# Reglas por artefacto (opcional). Ejemplo:
#   rules:
#     proposal:
#       - Máximo 500 palabras.

operations:
  archive:
    guidance:
      - Si el cambio implicó decisiones de arquitectura, convenciones técnicas nuevas, cambios de toolchain o del flujo de verificación, no editar AGENTS.md directamente - proponer a la persona usuaria el diff sugerido y esperar su aprobación explícita antes de aplicarlo y antes de dar el cambio por archivado.
      - Lo que vuelve a AGENTS.md son reglas e invariantes, cada una con su porqué en una línea, con el criterio de su sección "Cómo se escribe este archivo". El detalle del diseño del cambio (cómo funciona, enumeraciones de componentes, tipos o archivos, ejemplos puntuales) queda en las specs, el JSDoc o los comentarios.
      - Con el archivado commiteado y subido, activar el auto-merge del PR con un commit de merge (gh pr merge <número> --auto --merge), volver a main y borrar la rama local. GitHub mergea cuando pasa el CI del commit de archivado y borra la rama remota. Es el único paso en que se activa el auto-merge: el código del PR lo revisa antes la persona usuaria (ver "OpenSpec > Flujo" en AGENTS.md).
