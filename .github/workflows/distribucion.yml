name: Distribución

# Arma los binarios para macOS, Windows y Linux:
# - cada push a main reemplaza el prerelease "dev" con lo último;
# - un tag vX.Y.Z deja un release borrador con esa versión, para escribirle
#   las notas y publicarlo a mano;
# - un PR que toca este archivo o la configuración del bundle compila sin
#   publicar, para probar el cambio antes de mergearlo.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/distribucion.yml
      - src-tauri/tauri.conf.json

# Con dos merges seguidos alcanza con el build del último.
concurrency:
  group: distribucion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      etiqueta: ${{ steps.etiqueta.outputs.etiqueta }}
      identificador: ${{ steps.etiqueta.outputs.identificador }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Con el historial y los tags, que el identificador necesita para
          # contar los merges desde el último release.
          fetch-depth: 0
      - id: etiqueta
        name: Elegir la etiqueta de los archivos y el identificador del build
        run: |
          # El mismo módulo que usa la app (ver identificador-del-build.mjs).
          identificador=$(node identificador-del-build.mjs)
          echo "identificador=$identificador" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "etiqueta=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$identificador" == "${GITHUB_REF_NAME#v}+"* ]]; then
            # Solo un commit con el tag de su propia versión da un
            # identificador estable, que empieza con esa versión y un +.
            echo "etiqueta=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Si no, los binarios dirían una versión y el release otra.
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión del build ($identificador)"
            exit 1
          fi

  compilar:
    needs: preparar
    strategy:
      matrix:
        include:
          # Un solo .dmg para Apple Silicon e Intel.
          - plataforma: mac
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - plataforma: windows
            runner: windows-latest
          # Un AppImage corre solo donde la glibc es igual o más nueva que la
          # de donde se compiló: por eso el Ubuntu más viejo disponible.
          - plataforma: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # El build calcula el identificador que muestra la app: sin el
          # historial y los tags, el conteo de merges sale mal sin dar error.
          fetch-depth: 0
      # Lo que Tauri necesita para compilar en Linux, más ALSA para midir y lo
      # que usa el AppImage.
      - name: Instalar dependencias del sistema
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }}
      # Nombres sin la versión, para que los links al canal de desarrollo no
      # cambien entre builds.
      - name: Juntar los archivos a publicar
        env:
          ETIQUETA: ${{ needs.preparar.outputs.etiqueta }}
          PLATAFORMA: ${{ matrix.plataforma }}
        run: |
          mkdir publicar
          shopt -s nullglob
          for archivo in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
                         src-tauri/target/release/bundle/nsis/*.exe \
                         src-tauri/target/release/bundle/appimage/*.AppImage \
                         src-tauri/target/release/bundle/deb/*.deb; do
            cp "$archivo" "publicar/MagicMidi-$ETIQUETA-$PLATAFORMA.${archivo##*.}"
          done
          ls -l publicar
      - uses: actions/upload-artifact@v7
        with:
          name: binarios-${{ matrix.plataforma }}
          path: publicar/
          if-no-files-found: error

  publicar:
    needs: [preparar, compilar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: publicar
          merge-multiple: true
      - name: Reemplazar el prerelease de desarrollo
        if: github.ref_type == 'branch'
        env:
          IDENTIFICADOR: ${{ needs.preparar.outputs.identificador }}
        run: |
          # Se borra y se vuelve a crear, en vez de editarlo, para que el tag
          # pase al commit nuevo y el release muestre la fecha de este build.
          if gh release view dev > /dev/null 2>&1; then
            gh release delete dev --cleanup-tag --yes
          fi
          gh release create dev publicar/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Desarrollo $IDENTIFICADOR" \
            --notes "Lo último de \`main\`: el build $IDENTIFICADOR, del commit $GITHUB_SHA. No es una versión estable. Para instalarlo, ver el [README](https://github.com/$GH_REPO#descargar)."
      - name: Crear el borrador del release estable
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" publicar/* \
            --draft \
            --verify-tag \
            --title "MagicMidi ${{ needs.preparar.outputs.etiqueta }}" \
            --generate-notes
